<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8c8"/><stop offset="1" stop-color="#7cbfae"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/><stop offset="1" stop-color="#5e3a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4fbff" stop-opacity="0.9"/><stop offset="1" stop-color="#f4fbff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mint distemper wall -->
  <rect width="1200" height="630" fill="url(#wall)"/>
  <rect y="520" width="1200" height="110" fill="#6fb3a1"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#5e3a1a" stroke-width="3"/>

  <!-- signboard -->
  <g transform="translate(600,96)">
    <rect x="-440" y="-58" width="880" height="116" rx="14" fill="#c8102e" stroke="#5e3a1a" stroke-width="6"/>
    <rect x="-426" y="-44" width="852" height="88" rx="8" fill="#f4a300" opacity="0.18"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Yatra One','Rozha One',serif" font-size="52" fill="#fff4dc">रंगीला सैलून रेडियो</text>
  </g>
  <text x="600" y="176" text-anchor="middle" font-family="'Rozha One',serif" font-size="30" fill="#2b1d14">RANGEELA SALON RADIO · A/C · Prop. Pappu Bhai</text>

  <!-- mirror with bulbs -->
  <g transform="translate(250,400)">
    <rect x="-150" y="-140" width="300" height="280" rx="24" fill="url(#wood)" stroke="#5e3a1a" stroke-width="5"/>
    <rect x="-128" y="-118" width="256" height="236" rx="16" fill="#cfe7ef"/>
    <path d="M-60 -118 L20 -118 L-70 118 L-150 118 Z" fill="#ffffff" opacity="0.25"/>
    <g fill="#f4a300">
      <circle cx="-128" cy="-90" r="11"/><circle cx="-128" cy="0" r="11"/><circle cx="-128" cy="90" r="11"/>
      <circle cx="128" cy="-90" r="11"/><circle cx="128" cy="0" r="11"/><circle cx="128" cy="90" r="11"/>
      <circle cx="0" cy="-130" r="11"/><circle cx="0" cy="130" r="11"/>
    </g>
    <ellipse cx="0" cy="0" rx="180" ry="160" fill="url(#glow)"/>
  </g>

  <!-- transistor radio on a wooden counter -->
  <g transform="translate(830,380)">
    <rect x="-260" y="150" width="560" height="46" rx="10" fill="url(#wood)" stroke="#5e3a1a" stroke-width="4"/>
    <rect x="-190" y="-110" width="380" height="260" rx="22" fill="#fff4dc" stroke="#5e3a1a" stroke-width="6"/>
    <rect x="-160" y="-84" width="320" height="66" rx="8" fill="#1b2238"/>
    <g font-family="monospace" font-size="22" fill="#f4fbff">
      <text x="-146" y="-38">88</text><text x="-74" y="-38">92</text><text x="0" y="-38" text-anchor="middle">96</text><text x="72" y="-38">100</text><text x="148" y="-38">104</text>
    </g>
    <line x1="60" y1="-84" x2="60" y2="-18" stroke="#c8102e" stroke-width="5"/>
    <circle cx="-120" cy="40" r="42" fill="#d9dde0" stroke="#8a9096" stroke-width="6"/>
    <circle cx="-120" cy="40" r="12" fill="#8a9096"/>
    <g fill="#2b1d14">
      <rect x="-40" y="14" width="34" height="34" rx="6"/>
      <rect x="8" y="14" width="34" height="34" rx="6"/>
      <rect x="56" y="14" width="34" height="34" rx="6"/>
    </g>
    <circle cx="150" cy="30" r="10" fill="#c8102e"/>
    <g stroke="#2b1d14" stroke-width="4">
      <line x1="-40" y1="86" x2="170" y2="86"/><line x1="-40" y1="102" x2="170" y2="102"/>
      <line x1="-40" y1="118" x2="170" y2="118"/><line x1="-40" y1="134" x2="170" y2="134"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="600" y="590" text-anchor="middle" font-family="'Rozha One',serif" font-size="46" fill="#2b1d14">90s Hindi Gaane · Salon Radio</text>
</svg>
